<style>
/*
  Product page template. To make a page for another product, copy this file and
  change only the PRODUCT object in the script at the bottom: names, photos,
  features, callouts, specs and the "more" list. The layout builds itself from it.
*/
:root {
  --ground: #0d0a08;
  --ink: #f1ede6;
  --soft: #b9ae9f;
  --accent: #d1a548;
  --accent-2: #e2bf6d;
  --edge: rgba(209, 165, 72, .38);
  --glow: rgba(209, 165, 72, .22);
  --plate-1: #f2f0ec;
  --plate-2: #cfcac2;

  --display: "Unbounded", "Manrope", sans-serif;
  --text: "Manrope", system-ui, sans-serif;
  --arabic: "Vazirmatn", system-ui, sans-serif;

  --margin: clamp(16px, 3vw, 48px);
  --gap: clamp(96px, 12vw, 180px);
  --ease: cubic-bezier(.2, .7, .2, 1);
}
*, *::before, *::after { box-sizing: border-box; }
html { background: var(--ground); -webkit-text-size-adjust: 100%; }
body { margin: 0; color: var(--ink); font: 400 clamp(1rem, .96rem + .2vw, 1.125rem)/1.6 var(--text); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
[dir="rtl"] body { font-family: var(--arabic); line-height: 1.8; }
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; }
h1, h2, h3 { margin: 0; font-family: var(--display); font-weight: 500; letter-spacing: -.02em; line-height: 1.02; }
[dir="rtl"] h1, [dir="rtl"] h2, [dir="rtl"] h3 { font-family: var(--arabic); font-weight: 800; letter-spacing: 0; line-height: 1.3; }
p { margin: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
.wrap { padding-inline: var(--margin); max-width: 1440px; margin-inline: auto; }

/* Smoky ground */
.smoke { position: fixed; inset: 0; z-index: -1; overflow: hidden; background: var(--ground); }
.smoke::before, .smoke::after { content: ""; position: absolute; border-radius: 50%; filter: blur(140px); }
.smoke::before { width: 70vw; height: 70vw; left: -20vw; top: -30vw; background: #6b4b25; opacity: .45; }
.smoke::after { width: 60vw; height: 60vw; right: -22vw; bottom: -26vw; background: #2c3f5c; opacity: .35; }

/* Glass, as in the reference: faint fill, thin bright edge, soft glow in one corner */
.glass {
  position: relative; border-radius: 22px;
  border: 1px solid var(--edge);
  background: radial-gradient(90% 120% at 0% 0%, var(--glow), transparent 60%), linear-gradient(160deg, rgba(255,255,255,.06), rgba(255,255,255,.01) 60%), rgba(14, 11, 9, .45); /* taste-skill-ignore: glass */
  -webkit-backdrop-filter: blur(16px) saturate(1.2); backdrop-filter: blur(16px) saturate(1.2);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07), 0 24px 60px rgba(0,0,0,.35);
}
.pill {
  display: inline-flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 26px; border-radius: 999px;
  font: 600 1rem/1 inherit; font-family: inherit; text-decoration: none; cursor: pointer; border: 1px solid var(--edge);
  transition: background-color 250ms ease, transform 250ms var(--ease), border-color 250ms ease;
}
.pill svg { width: 20px; height: 20px; }
.pill--gold { background: var(--accent); color: #1d1410; border-color: var(--accent); }
.pill--gold:hover { background: var(--accent-2); transform: translateY(-2px); }
.pill--ghost { background: rgba(255,255,255,.04); color: var(--ink); }
.pill--ghost:hover { border-color: var(--accent); background: rgba(209,165,72,.12); }
.circle { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.03); color: var(--accent-2); cursor: pointer; transition: border-color 250ms ease, background-color 250ms ease; }
.circle:hover { border-color: var(--accent); background: rgba(209,165,72,.12); }
.circle svg { width: 18px; height: 18px; }
[dir="rtl"] .flip svg { transform: scaleX(-1); }
#prev svg { transform: scaleX(-1); }
[dir="rtl"] #prev svg { transform: none; }
.label { font: 500 .8125rem/1.3 var(--text); letter-spacing: .14em; text-transform: uppercase; color: var(--soft); }
[dir="rtl"] .label { font-family: var(--arabic); letter-spacing: 0; font-size: .9375rem; }

/* Studio plate: a soft-lit surface the white product photos melt into */
.plate { border-radius: 22px; background: radial-gradient(70% 70% at 50% 40%, var(--plate-1), var(--plate-2)); overflow: hidden; position: relative; } /* taste-skill-ignore: studio light */
.plate img { mix-blend-mode: multiply; filter: brightness(1.13) contrast(1.12); width: 100%; height: 100%; object-fit: contain; }

/* Top bar */
.top { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 18px; }
.top__back { display: inline-flex; align-items: center; gap: 12px; text-decoration: none; font-weight: 600; }
.top__back .circle { width: 44px; height: 44px; }
.top__back .circle svg { transform: scaleX(-1); }
[dir="rtl"] .top__back .circle svg { transform: none; }
.top__logo { width: 70px; display: block; position: relative; overflow: hidden; aspect-ratio: 1576 / 1356; }
.top__logo img { position: absolute; max-width: none; width: 152.3%; left: -26.14%; top: -41%; }
.langs { display: flex; gap: 2px; }
.langs button { background: none; border: 0; cursor: pointer; color: var(--soft); font: 600 .9375rem/1 var(--text); padding: 10px 8px; }
.langs button[lang] { font-family: var(--arabic); }
.langs button[aria-pressed="true"] { color: var(--accent-2); }

/* Hero */
.hero { position: relative; padding-top: 24px; }
.hero__meta { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.hero__meta span:nth-child(2) { text-align: center; } .hero__meta span:nth-child(3) { text-align: center; } .hero__meta span:last-child { text-align: end; }
.hero__stage { position: relative; display: grid; grid-template-columns: 1fr minmax(280px, 520px) 1fr; align-items: end; gap: clamp(16px, 3vw, 48px); margin-top: 24px; }
.hero__plate { aspect-ratio: 1 / 1.08; z-index: 2; }
.hero__plate img { padding: 6% 10% 2%; }
.hero__side { padding-bottom: 18vh; display: grid; gap: 22px; max-width: 30ch; }
.hero__side--end { justify-self: end; text-align: end; }
.hero__side p { color: var(--soft); }
.hero__side strong { display: block; font: 500 1.125rem/1.3 var(--display); color: var(--ink); }
[dir="rtl"] .hero__side strong { font-family: var(--arabic); font-weight: 800; }
.hero h1 {
  position: relative; z-index: 1;
  font-size: clamp(6rem, 26vw, 25rem); line-height: .78; letter-spacing: -.05em; text-align: center;
  margin-top: calc(clamp(6rem, 26vw, 25rem) * -.42);
  color: var(--ink); white-space: nowrap;
}
[dir="rtl"] .hero h1 { font-family: var(--display); font-weight: 500; letter-spacing: -.05em; line-height: .78; }
.hero__sub { display: flex; justify-content: space-between; align-items: center; gap: 20px; flex-wrap: wrap; margin-top: 28px; }
.hero__sub .label { color: var(--accent-2); }
.hero__ctas { display: flex; gap: 10px; flex-wrap: wrap; }

/* About */
.about { margin-top: var(--gap); display: grid; grid-template-columns: 5fr 7fr; gap: clamp(16px, 3vw, 40px); align-items: stretch; }
.about__plate { aspect-ratio: 4 / 5; }
.about__plate img { padding: 10%; }
.about__body { padding: clamp(28px, 4vw, 56px); display: flex; flex-direction: column; justify-content: space-between; gap: 40px; }
.about h2 { font-size: clamp(2.25rem, 1.4rem + 3.4vw, 4.5rem); }
.about__text { display: grid; gap: 18px; max-width: 58ch; color: var(--soft); font-size: 1.0625rem; }
.about__text p:first-child { color: var(--ink); font-size: clamp(1.125rem, 1rem + .5vw, 1.375rem); line-height: 1.5; }
.about__row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
.stat { padding: 18px; border-radius: 16px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.025); }
.stat b { display: block; font: 500 clamp(1.5rem, 1.2rem + 1vw, 2.125rem)/1 var(--display); color: var(--accent-2); }
.stat span { display: block; margin-top: 10px; font-size: .9375rem; color: var(--soft); }

/* Section heads with the reference's carousel controls */
.head { display: flex; justify-content: space-between; align-items: end; gap: 24px; flex-wrap: wrap; }
.head h2 { font-size: clamp(2rem, 1.3rem + 2.8vw, 3.75rem); margin-top: 14px; max-width: 18ch; }
.controls { display: flex; align-items: center; gap: 14px; }
.controls output { font: 500 .9375rem/1 var(--text); color: var(--soft); min-width: 56px; text-align: center; font-variant-numeric: tabular-nums; }

/* Features: numbered glass cards with an icon circle */
.features { margin-top: var(--gap); }
.cards { margin-top: 48px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.card { padding: 26px; min-height: 300px; display: flex; flex-direction: column; justify-content: space-between; gap: 40px; transition: transform 400ms var(--ease), border-color 300ms ease; }
.card:hover { transform: translateY(-4px); border-color: rgba(209,165,72,.65); }
.card__top { display: flex; justify-content: space-between; align-items: center; }
.card__num { font: 500 .875rem/1 var(--text); color: var(--soft); letter-spacing: .08em; }
.card__icon { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.03); color: var(--accent-2); }
.card__icon svg { width: 22px; height: 22px; }
.card h3 { font-size: 1.375rem; }
.card p { margin-top: 12px; color: var(--soft); font-size: 1rem; }

/* Anatomy: the product with labelled parts */
.anatomy { margin-top: var(--gap); }
.anatomy__stage { margin-top: 48px; display: grid; grid-template-columns: 1fr minmax(320px, 620px) 1fr; gap: clamp(16px, 3vw, 40px); align-items: center; }
.anatomy__plate { aspect-ratio: 1666 / 1582; }
.anatomy__plate img { padding: 4%; }
.parts { display: grid; gap: 14px; list-style: none; margin: 0; padding: 0; }
.part { padding: 20px 22px; cursor: default; transition: border-color 300ms ease, transform 400ms var(--ease); }
.part.is-on { border-color: rgba(209,165,72,.8); transform: translateX(var(--nudge, 6px)); }
.parts--end .part.is-on { --nudge: -6px; }
[dir="rtl"] .part.is-on { --nudge: -6px; } [dir="rtl"] .parts--end .part.is-on { --nudge: 6px; }
.part__name { display: flex; align-items: center; gap: 10px; font: 500 1.0625rem/1.2 var(--display); }
[dir="rtl"] .part__name { font-family: var(--arabic); font-weight: 800; }
.part__name i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font: 600 .75rem/1 var(--text); font-style: normal; background: var(--accent); color: #1d1410; flex: none; }
.part p { margin-top: 8px; color: var(--soft); font-size: .9375rem; }
.dot { position: absolute; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #1d1410; font: 600 .8125rem/1 var(--text); box-shadow: 0 0 0 6px rgba(209,165,72,.28); transition: transform 300ms var(--ease), box-shadow 300ms ease; }
.dot.is-on { transform: scale(1.2); box-shadow: 0 0 0 10px rgba(209,165,72,.32); }

/* Views gallery */
.views { margin-top: var(--gap); }
.views__grid { margin-top: 48px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.view { aspect-ratio: 4 / 5; }
.view img { padding: 10% 12%; transition: transform 800ms var(--ease); }
.view:hover img { transform: scale(1.05); }
.view__tag { position: absolute; top: 18px; inset-inline-end: 20px; font: 500 .8125rem/1 var(--text); letter-spacing: .12em; color: #3b3129; z-index: 1; }
.view__brand { position: absolute; top: 18px; inset-inline-start: 20px; font: 600 .75rem/1 var(--display); color: #3b3129; z-index: 1; }

/* Specs */
.specs { margin-top: var(--gap); display: grid; grid-template-columns: 5fr 7fr; gap: clamp(16px, 3vw, 40px); align-items: start; }
.specs h2 { font-size: clamp(2rem, 1.3rem + 2.8vw, 3.75rem); margin-top: 14px; }
.specs__intro p { margin-top: 20px; color: var(--soft); max-width: 40ch; }
.specs table { width: 100%; border-collapse: collapse; }
.specs__box { padding: 10px 28px; }
.specs td { padding: 18px 0; border-bottom: 1px solid rgba(255,255,255,.08); vertical-align: top; }
.specs tr:last-child td { border-bottom: 0; }
.specs td:first-child { color: var(--soft); width: 42%; }
.specs td:last-child { text-align: end; font-weight: 600; }

/* More from the range: carousel like the reference */
.more { margin-top: var(--gap); }
.track { margin-top: 48px; display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; }
.track::-webkit-scrollbar { display: none; }
.mini { flex: 0 0 calc((100% - 48px) / 3.3); scroll-snap-align: start; padding: 14px 14px 22px; display: flex; flex-direction: column; gap: 18px; text-decoration: none; transition: border-color 300ms ease, transform 400ms var(--ease); }
.mini:hover { border-color: rgba(209,165,72,.7); transform: translateY(-4px); }
.mini .plate { aspect-ratio: 1; }
.mini .plate img { padding: 10%; }
.mini__row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-inline: 8px; }
.mini h3 { font-size: 1.125rem; }
.mini small { display: block; margin-top: 6px; color: var(--soft); font-size: .875rem; }
.mini .circle { width: 42px; height: 42px; flex: none; }
.bar { margin-top: 28px; height: 2px; background: rgba(255,255,255,.1); border-radius: 2px; }
.bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 2px; transition: width 150ms linear; }

/* Closing */
.close { margin-top: var(--gap); padding: clamp(32px, 6vw, 80px); text-align: center; display: grid; justify-items: center; gap: 24px; }
.close h2 { font-size: clamp(2.25rem, 1.3rem + 4vw, 5.5rem); max-width: 14ch; }
.close p { color: var(--soft); max-width: 46ch; }
footer { padding: 48px var(--margin) 28px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; color: var(--soft); font-size: .875rem; max-width: 1440px; margin-inline: auto; }
footer a { color: var(--soft); }

/* Entrances */
.js [data-in] { opacity: 0; transform: translateY(28px); transition: opacity 900ms var(--ease), transform 900ms var(--ease); transition-delay: calc(var(--d, 0) * 90ms); }
.js [data-in].is-in { opacity: 1; transform: none; }
.js .hero h1 { animation: rise 1300ms var(--ease) both; }
.js .hero__plate { animation: lift 1300ms var(--ease) 150ms both; }
@keyframes rise { from { opacity: 0; transform: translateY(18%); } }
@keyframes lift { from { opacity: 0; transform: translateY(40px) scale(.97); } }
@media (prefers-reduced-motion: reduce) { .js [data-in] { opacity: 1; transform: none; transition: none; } .js .hero h1, .js .hero__plate { animation: none; } * { transition-duration: 1ms !important; } }

/* Tablet */
@media (max-width: 1024px) {
  .hero__stage { grid-template-columns: 1fr; justify-items: center; }
  .hero__side { padding-bottom: 0; max-width: 46ch; text-align: center; justify-self: center; order: 2; }
  .hero__side--end { order: 3; }
  .hero__plate { width: min(100%, 460px); order: 1; }
  .hero h1 { margin-top: 24px; }
  .about, .specs { grid-template-columns: 1fr; }
  .about__plate { aspect-ratio: 16 / 11; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .anatomy__stage { grid-template-columns: 1fr 1fr; }
  .anatomy__plate { grid-column: 1 / -1; order: -1; max-width: 560px; justify-self: center; width: 100%; }
  .mini { flex-basis: calc((100% - 16px) / 2.2); }
}
/* Phone */
@media (max-width: 640px) {
  .hero__meta { grid-template-columns: 1fr 1fr; row-gap: 8px; }
  .hero__meta span:nth-child(2) { text-align: end; } .hero__meta span:nth-child(3) { text-align: start; }
  .top__back span { display: none; }
  .about__row { grid-template-columns: 1fr; }
  .cards { grid-template-columns: 1fr; }
  .card { min-height: 0; gap: 28px; }
  .anatomy__stage { grid-template-columns: 1fr; }
  .views__grid { grid-template-columns: 1fr; }
  .view { aspect-ratio: 1; }
  .mini { flex-basis: 78%; }
  .pill { width: 100%; justify-content: center; }
  .hero__ctas { width: 100%; }
}
</style>
</head>

<div class="wrap">

    <section class="about" id="details" aria-labelledby="about-h">
      <div class="plate about__plate" data-in><img id="about-img" alt="" width="1666" height="1582" loading="lazy"></div>

        <div>
          <span class="label" data-t="aboutLabel"></span>
          <h2 id="about-h" style="margin-top:14px"></h2>

/* ---------- Build ---------- */
const $ = id => document.getElementById(id);

let lang = document.documentElement.lang === 'ar' || document.documentElement.lang === 'ckb' ? document.documentElement.lang : 'en';
const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('is-in'); io.unobserve(e.target); } }), { threshold: .12 });

function render() {
  const P = PRODUCT, x = P.text[lang], u = UI[lang];
  document.documentElement.lang = lang; document.documentElement.dir = lang === 'en' ? 'ltr' : 'rtl';
  document.title = `${P.brand} ${P.name} — Al Shuyukh Coffee`;
  document.querySelectorAll('[data-t]').forEach(el => { el.textContent = u[el.dataset.t]; });
  document.querySelectorAll('.langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  $('prev').setAttribute('aria-label', u.prev); $('next').setAttribute('aria-label', u.next);

  $('meta').innerHTML = x.meta.map(m => `<span>${m}</span>`).join('');
  $('claim').textContent = x.claim; $('claim-p').textContent = x.claimP;
  $('where').textContent = x.where; $('where-p').textContent = x.whereP;

  $('ask-hero').href = $('ask-close').href = wa(u.askMsg(`${P.brand} ${P.name}`));

  $('about-h').textContent = x.aboutH;
  $('about-img').src = P.photos.side; $('about-img').alt = `${P.brand} ${P.name}, side view`;
  $('about-text').innerHTML = x.about.map(p => `<p>${p}</p>`).join('');
  $('stats').innerHTML = x.stats.map(([b, s]) => `<div class="stat"><b>${b}</b><span>${s}</span></div>`).join('');

  $('cards').innerHTML = x.features.map(([h, p], i) => `<article class="glass card" data-in style="--d:${i}"><div class="card__top"><span class="card__num">${pad(i + 1)}</span><span class="card__icon" aria-hidden="true"><svg><use href="#${P.icons[i]}"/></svg></span></div><div><h3>${h}</h3><p>${p}</p></div></article>`).join('');

  $('anatomy-img').src = P.photos.side; $('anatomy-img').alt = `${P.brand} ${P.name} with its parts numbered`;
  const part = (pt, i) => `<li class="glass part" data-part="${i}" tabindex="0"><span class="part__name"><i>${i + 1}</i>${pt[0]}</span><p>${pt[1]}</p></li>`;
  $('parts-a').innerHTML = x.parts.slice(0, 2).map((pt, i) => part(pt, i)).join('');
  $('parts-b').innerHTML = x.parts.slice(2).map((pt, i) => part(pt, i + 2)).join('');
  const plate = $('anatomy-plate');
  plate.querySelectorAll('.dot').forEach(d => d.remove());
  P.dots.forEach(([l, t], i) => plate.insertAdjacentHTML('beforeend', `<span class="dot" data-part="${i}" style="left:${l}%;top:${t}%" aria-hidden="true">${i + 1}</span>`));

  const shots = [P.photos.front, P.photos.side, P.photos.back];
  $('views').innerHTML = shots.map((src, i) => `<figure class="plate view" data-in style="--d:${i};margin:0"><span class="view__brand">${P.brand.toUpperCase()}</span><span class="view__tag">[${x.views[i]}]</span><img src="${src}" alt="${P.name}, ${x.views[i].toLowerCase()}" loading="lazy"></figure>`).join('');

  $('specs').innerHTML = x.specs.map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join('');

  $('track').innerHTML = P.more.map(m => `<a class="glass mini" href="${wa(u.askMsg(`${m.brand} ${m.name}`))}"><div class="plate"><img src="${m.img}" alt="${m.brand} ${m.name}" loading="lazy"></div><div class="mini__row"><div><h3 dir="ltr">${m.name}</h3><small>${m.brand}</small></div><span class="circle flip" aria-hidden="true"><svg><use href="#i-wa"/></svg></span></div></a>`).join('');
  $('close-h').textContent = x.closeH;

  document.querySelectorAll('[data-in]').forEach(el => io.observe(el));
  bindParts(); $('track').scrollLeft = 0; progress();
}

function bindParts() {
  const set = n => document.querySelectorAll('[data-part]').forEach(el => el.classList.toggle('is-on', el.dataset.part === n));
  document.querySelectorAll('.part').forEach(p => {
    p.addEventListener('pointerenter', () => set(p.dataset.part));
    p.addEventListener('focus', () => set(p.dataset.part));
    p.addEventListener('pointerleave', () => set(null));
    p.addEventListener('blur', () => set(null));
  });
}

/* Carousel with counter and progress line */
const track = $('track');
function progress() {
  const max = track.scrollWidth - track.clientWidth;
  const f = max > 0 ? Math.abs(track.scrollLeft) / max : 0;
  const view = track.clientWidth / track.scrollWidth;
  $('bar').style.width = (view + (1 - view) * f) * 100 + '%';
  const n = PRODUCT.more.length;
  $('count').textContent = `${pad(Math.min(n, Math.round(f * (n - 1)) + 1))} / ${pad(n)}`;
}
track.addEventListener('scroll', progress, { passive: true });
addEventListener('resize', progress);
const step = () => (track.firstElementChild.offsetWidth + 16) * (document.dir === 'rtl' ? -1 : 1);
$('next').addEventListener('click', () => track.scrollBy({ left: step(), behavior: 'smooth' }));
$('prev').addEventListener('click', () => track.scrollBy({ left: -step(), behavior: 'smooth' }));

document.querySelectorAll('.langs button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang; try { localStorage.setItem('lang', lang); } catch (e) {} render();
}));
render();
